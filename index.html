<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d0b1f">
  <meta name="description" content="JEEwise — focused JEE previous year question practice by Ayush Sachdeva.">
  <title>JEEwise</title>
  <link rel="icon" type="image/png" href="assets/jeewise-logo.png">
  <link rel="apple-touch-icon" href="assets/jeewise-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Theme is applied before first paint so there is no dark/light flash.
    (function () {
      try {
        var t = JSON.parse(localStorage.getItem('jeePractice_theme_v3') || 'null');
        if (t !== 'light') t = 'dark';
        document.documentElement.dataset.theme = t;
      } catch (e) { document.documentElement.dataset.theme = 'dark'; }
    })();
    // MathJax is typeset on demand (only what is on screen), never for the whole page.
    window.MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] },
      chtml: { scale: 1, matchFontHeight: true },
      options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] },
      startup: {
        typeset: false,
        ready: function () {
          MathJax.startup.defaultReady();
          MathJax.startup.promise.then(function () {
            window.__mjReady = true;
            document.dispatchEvent(new Event('mj-ready'));
          });
        }
      }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-chtml.js" onerror="window.__mjFailed=true;document.dispatchEvent(new Event('mj-ready'))"></script>
</head>
<body>
  <div class="splash" id="splash" role="status" aria-label="Loading JEEwise">
    <img src="assets/jeewise-logo.png" alt="" onerror="this.remove()">
    <b>JEEwise</b>
    <span>by Ayush Sachdeva</span>
    <i class="splash-bar"></i>
  </div>

  <div class="shell" id="shell">
    <aside class="side" aria-label="Main navigation">
      <a class="brand" href="#/">
        <img src="assets/jeewise-logo.png" alt="" onerror="this.remove()">
        <span><b>JEEwise</b><small>by Ayush Sachdeva</small></span>
      </a>
      <nav class="nav" id="sideNav"></nav>
      <div class="side-foot">
        <button class="nav-item" data-act="theme"><span data-icon="sun"></span><span>Switch theme</span></button>
        <button class="nav-item" data-act="shortcuts"><span data-icon="keyboard"></span><span>Keyboard shortcuts</span></button>
      </div>
    </aside>

    <div class="content">
      <header class="top">
        <a class="top-brand" href="#/"><b>JEEwise</b></a>
        <div class="seg" id="examSeg" role="tablist" aria-label="Exam">
          <button role="tab" data-act="exam" data-v="jee-main">JEE Main</button>
          <button role="tab" data-act="exam" data-v="jee-advanced">JEE Advanced</button>
        </div>
        <button class="icon-btn top-theme" data-act="theme" aria-label="Switch theme"><span data-icon="sun"></span></button>
      </header>
      <main class="view" id="view" tabindex="-1"></main>
    </div>
  </div>

  <nav class="tabbar" id="tabBar" aria-label="Main navigation"></nav>

  <div class="modal-root" id="modalRoot" hidden></div>

  <section class="practice" id="practice" hidden aria-label="Practice session"></section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
